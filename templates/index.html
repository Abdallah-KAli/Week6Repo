<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis AI Model</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #1e293b, #020617);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 520px;
            min-height: 650px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 8px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: rgba(2, 6, 23, 0.45);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.12);
        }

        .msg {
            padding: 12px 14px;
            margin: 10px 0;
            border-radius: 14px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 15px;
        }

        .user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            margin-left: auto;
        }

        .bot {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .result-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: bold;
            margin-top: 6px;
        }

        .positive {
            background: rgba(34, 197, 94, 0.18);
            color: #4ade80;
        }

        .negative {
            background: rgba(239, 68, 68, 0.18);
            color: #f87171;
        }

        .neutral {
            background: rgba(234, 179, 8, 0.18);
            color: #facc15;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: #020617;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            padding: 0 22px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="app">
    <div class="header">
        <h1>💬 Sentiment Analysis AI Model</h1>
        <p>Enter a sentence and the model will classify it as positive, negative, or neutral.</p>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input id="text" placeholder="Type a message to analyze..." onkeydown="if(event.key==='Enter') send()" />
        <button onclick="send()">Analyze</button>
    </div>
</div>

<script>
async function send() {
    let input = document.getElementById("text");
    let text = input.value;

    if (!text.trim()) return;

    addUser(text);
    input.value = "";

    let res = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    });

    let data = await res.json();

    addBot(data);
}

function addUser(text) {
    let div = document.createElement("div");
    div.classList.add("msg", "user");
    div.innerText = text;
    append(div);
}

function addBot(data) {
    let div = document.createElement("div");
    div.classList.add("msg", "bot");

    let result = data.result || "unknown";
    let confidence = data.confidence !== null && data.confidence !== undefined
        ? data.confidence + "%"
        : "N/A";

    div.innerHTML = `
        <div class="result-title">${data.emoji} Sentiment Result</div>
        <div class="badge ${result}">${result.toUpperCase()}</div>
        <div style="margin-top:8px; color:#cbd5e1;">Confidence: ${confidence}</div>
    `;

    append(div);
}

function append(div) {
    let box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
