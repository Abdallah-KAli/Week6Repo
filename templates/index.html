<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Chat AI</title>

    <style>
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box {
            width: 450px;
            height: 600px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .msg {
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            color: white;
            max-width: 80%;
        }

        .user {
            background: #6366f1;
            margin-left: auto;
        }

        .bot {
            background: rgba(255,255,255,0.1);
        }

        .input {
            display: flex;
            padding: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: #8b5cf6;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="messages" id="messages"></div>

    <div class="input">
        <input id="text" placeholder="Type message..." />
        <button onclick="send()">Send</button>
    </div>

</div>

<script>
async function send() {
    let text = document.getElementById("text").value;
    if (!text.trim()) return;

    add(text, "user");

    document.getElementById("text").value = "";

    let res = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    });

    let data = await res.json();

    let output = data.emoji + " " + data.result;

    if (data.confidence !== null && data.confidence !== undefined) {
        output += " (" + data.confidence + "%)";
    }

    add(output, "bot");
}

function add(text, type) {
    let div = document.createElement("div");
    div.classList.add("msg", type);
    div.innerText = text;

    let box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
